name: Secret Scan (Gitleaks)    #comments with (f) notation were added on 01-09-2026 by Fayez Almadi

on:
  #workflow allows you to call this script as a job inside another workflow. (f)
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Gitleaks release version to install"
        #asks for user input as a string. (f)
        type: string
        default: "8.27.2" #shall be changed into a global counter. (f)
      full_history:
        description: "Scan full git history (fetch-depth: 0). Set false to scan HEAD only."
        type: boolean
        default: true

jobs:
  secret-scan:
    name: Gitleaks — secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # required to post SARIF results to the Security tab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.full_history && 0 || 1 }} #this line can be removed, as it always gives true which means it will always make a head scan only. (f)
                                                            #it is more accurate to always make a full scan, as it will show you if the previously noted issues were fixed or not. (f)
                                                            # 1 means true, 0 means false .... but according to fetch-depth.. 0 means true (full scan) (f)
                                                            #this difference in meanings is what makes the confusion. (f)

      - name: Cache Gitleaks binary
        id: cache-gitleaks
        uses: actions/cache@v4
        with:
          path: /tmp/gitleaks-bin #this is a temporary path inside the VM to hold the cache. (f)
          key: gitleaks-${{ inputs.gitleaks_version }}-linux-x64 #here we name the cache file using the user inpit (gitleaks_version) (f)

      - name: Install Gitleaks
        if: steps.cache-gitleaks.outputs.cache-hit != 'true' #the output of this line is either 'true' or '' which means false. (f)
        run: |
          mkdir -p /tmp/gitleaks-bin #this link is already provided by cache@v4 action -s stands for silent -S stands for showing errors and -L means follow redirect (f)
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${{ inputs.gitleaks_version }}/gitleaks_${{ inputs.gitleaks_version }}_linux_x64.tar.gz" \
            | tar -xz -C /tmp/gitleaks-bin gitleaks 


      - name: Add Gitleaks to PATH
        run: echo "/tmp/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Run Gitleaks
        id: gitleaks
        continue-on-error: true
        #this line will detect the possible depth and start scanning from the root direcotry of the repository then save the result as sarif extension. (f)
        run: |
          gitleaks detect --source . --log-opts="--all" -v --report-format sarif --report-path gitleaks.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore    #even if there was no secrets found (the scan was successful) it will upload the sarif report (empty) (f)

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks  # groups results under this label in the Security tab


      - name: Summary
        if: always()
        run: |
          echo "## Secret Scan (Gitleaks)" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Findings |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ -f gitleaks.sarif ]; then
            COUNT=$(python3 -c "
          import json, sys
          with open('gitleaks.sarif') as f:
              data = json.load(f)
          results = [r for run in data.get('runs', []) for r in run.get('results', [])]
          print(len(results))
          " 2>/dev/null || echo "?")
            if [ "$COUNT" = "0" ]; then
              echo "| PASSED | No secrets detected |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| FAILED | $COUNT secret(s) detected |" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "| PASSED | No secrets detected |" >> "$GITHUB_STEP_SUMMARY"
          fi



